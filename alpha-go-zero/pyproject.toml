[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "weiqi-zero-lab"
version = "0.1.0"
description = "Local Go self-play, search and evaluation workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "filelock>=3.13,<4", "pydantic>=2.6,<3"]
[project.scripts]
weiqi-zero = "zero.cli:main"

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]

[tool.setuptools]
packages = ["zero"]
