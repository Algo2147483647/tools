<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HTML export interaction fixture</title>
  </head>
  <body style="margin: 0">
    <iframe
      id="viewer"
      title="Export viewer test"
      sandbox="allow-scripts allow-same-origin"
      style="border: 0; width: 100vw; height: 100vh"
    ></iframe>
    <script type="module">
      import { buildHtmlDocument, buildHtmlPayload, prepareHtmlSvg } from "/src/rendering/export-html.ts";
      import {
        buildFlatPreviewStage,
        previewGeometry,
        INITIAL_PREVIEW_VIEW,
        PREVIEW_GRAPHS,
      } from "/src/components/settings/previewModel.ts";
      import { DEFAULT_GRAPH_APPEARANCE } from "/src/graph/appearance.ts";
      const stage = buildFlatPreviewStage(
        previewGeometry({
          chartType: "node-link",
          layoutMode: "sugiyama",
          appearance: DEFAULT_GRAPH_APPEARANCE,
          showNodeDetail: true,
          alignNodeWidthsToMax: false,
          view: INITIAL_PREVIEW_VIEW,
        }),
      );
      const graph = structuredClone(PREVIEW_GRAPHS["node-link"]);
      graph.nodes.request.define = "**Offline fields** with $x^2$ and a [reference](https://example.com).";
      const markup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect width="800" height="400" fill="#f8fafd"/><path class="dag-edge__path" d="M240 180H480" fill="none" stroke="#9cacbf" stroke-width="2"/><g class="dag-node" data-key="request" role="button" aria-label="Request" transform="translate(60,140)"><rect class="dag-node__shape" width="180" height="80" rx="12" fill="white" stroke="#c8d5e8"/><text x="24" y="46" font-family="Segoe UI" font-size="18">Request</text></g><g class="dag-node" data-key="validate" role="button" aria-label="Validate" transform="translate(480,140)"><rect class="dag-node__shape" width="180" height="80" rx="12" fill="white" stroke="#c8d5e8"/><text x="24" y="46" font-family="Segoe UI" font-size="18">Validate</text></g><script>alert("must be stripped")<\/script></svg>`;
      stage.nodes = stage.nodes.filter((node) => ["request", "validate"].includes(node.key));
      const svg = new DOMParser().parseFromString(markup, "image/svg+xml").documentElement;
      document.getElementById("viewer").srcdoc = buildHtmlDocument(prepareHtmlSvg(svg), buildHtmlPayload(stage, graph));
    </script>
  </body>
</html>
