<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Explorer UI preview</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = await navigator.storage.getDirectory();
      const folder = await root.getDirectoryHandle(`sidebar-${Date.now()}`, { create: true });
      window.showDirectoryPicker = async () => folder;
      await import("/src/main.tsx");
    </script>
  </body>
</html>
