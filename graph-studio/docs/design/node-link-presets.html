<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Graph Studio · Node-link 默认预设</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #26364c;
        font:
          14px/1.6 "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #5276b0;
        outline-offset: 3px;
      }
      main {
        max-width: 1240px;
        margin: 44px auto;
        padding: 0 28px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      header small {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: #8490a1;
      }
      h1 {
        font-size: 25px;
        margin: 4px 0;
      }
      header p {
        margin: 0;
        color: #7c8898;
        font-size: 13px;
      }
      .badge {
        font-size: 12px;
        color: #53709b;
        background: #edf2f9;
        border: 1px solid #dfe6f0;
        border-radius: 20px;
        padding: 6px 13px;
        white-space: nowrap;
      }
      .preview {
        background: #fff;
        border: 1px solid #e4e8ee;
        border-radius: 14px;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 17px 22px;
        border-bottom: 1px solid #edf0f4;
      }
      .toolbar strong {
        font-size: 14px;
        font-weight: 600;
      }
      .toolbar small {
        color: #8b95a4;
        margin-left: 8px;
      }
      .zoom {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .zoom button {
        border: 1px solid #e1e6ee;
        background: white;
        color: #60738e;
        border-radius: 5px;
        padding: 4px 11px;
        font-size: 12px;
      }
      .zoom button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .zoom span {
        min-width: 45px;
        font-size: 11px;
        text-align: center;
        color: #8b95a4;
      }
      .canvas {
        height: 350px;
        overflow: auto;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas.zoomed {
        align-items: flex-start;
        justify-content: flex-start;
      }
      .graph-host {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 100%;
        flex-shrink: 0;
      }
      .selection {
        color: #7d8ba0;
        font-size: 12px;
        padding: 0 22px 16px;
        min-height: 35px;
      }
      .specs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 20px 22px;
        border-top: 1px solid #edf0f4;
        margin: 0;
        background: #fbfcfe;
      }
      .specs dt {
        font-size: 11px;
        color: #8b95a4;
        margin-bottom: 4px;
      }
      .specs dd {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: #42516a;
      }
      .specs small {
        display: block;
        font-size: 11px;
        color: #95a0af;
        margin-top: 3px;
        font-weight: 400;
      }
      footer {
        font-size: 12px;
        color: #8d97a6;
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      @media (max-width: 700px) {
        main {
          margin: 24px auto;
          padding: 0 16px;
        }
        .specs {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
        }
        .toolbar {
          padding: 14px;
          flex-wrap: wrap;
        }
        .canvas {
          height: 280px;
        }
        h1 {
          font-size: 21px;
        }
      }
      @media (max-width: 400px) {
        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }
        .toolbar small {
          display: none;
        }
        .specs {
          padding: 16px;
        }
      }
    </style>
  </head>

    <main>
      <header>
        <div>
          <small>GRAPH STUDIO / NODE-LINK</small>
          <h1>默认预设</h1>
          <p>无边框 · 无详情 · 等宽节点 · 保留 dot</p>
        </div>
        <span class="badge">Node-link · 唯一预设</span>

      <section class="preview" aria-label="默认预设预览">

        <div class="canvas"><div class="graph-host"></div></div>

            <dt>节点</dt>
            <dd>240 × 48 px<small>等宽 · 16 px 圆角</small></dd>
          </div>
          <div>
            <dt>内容</dt>
            <dd>Times New Roman<small>仅标题 + dot · 无边框 · 无详情</small></dd>
          </div>
          <div>
            <dt>阴影</dt>
            <dd>轻阴影 · 10%<small>模糊 8 px · 偏移 3 px</small></dd>
          </div>
          <div>
            <dt>连线</dt>
            <dd>淡灰 #E1E3E6<small>1 px · 开放式箭头 · 隐藏边值</small></dd>
          </div>
        </dl>
      </section>
      <footer><span>只保留这一套 Node-link 默认预设。</span><span>已设为应用默认 · 与正式渲染一致</span></footer>
    </main>

      const canvas = document.querySelector(".canvas");
      const host = document.querySelector(".graph-host");
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML =
        '<style>:host{display:block}svg{width:100%;height:100%;display:block;font-family:"Segoe UI",sans-serif}</style>' +
        presets[0].svg;
      const svg = root.querySelector("svg");
      let zoom = 1;
      function setZoom(value) {
        zoom = Math.max(1, Math.min(3, value));
        host.style.width = zoom * 100 + "%";
        host.style.height = zoom * 100 + "%";
        canvas.classList.toggle("zoomed", zoom > 1);
        document.getElementById("zoom-level").textContent = zoom === 1 ? "适配" : Math.round(zoom * 100) + "%";
        if (zoom === 1) {
          canvas.scrollLeft = 0;
          canvas.scrollTop = 0;
        }
        document.getElementById("zoom-out").disabled = zoom === 1;
        document.getElementById("zoom-in").disabled = zoom === 3;
      }
      function highlight(key) {
        const neighbors = new Set();
        svg.querySelectorAll(".dag-edge").forEach((edge) => {
          const active = key && (edge.dataset.source === key || edge.dataset.target === key);
          edge.dataset.active = String(Boolean(active));
          if (active) {
            neighbors.add(edge.dataset.source);
            neighbors.add(edge.dataset.target);
          }
        });
        svg.dataset.hasInteractiveNode = String(Boolean(key));
        svg.querySelectorAll(".dag-node").forEach((node) => {
          node.dataset.focused = String(node.dataset.key === key);
          node.dataset.connected = String(neighbors.has(node.dataset.key) && node.dataset.key !== key);
        });
        document.getElementById("selection-status").textContent = key
          ? "已选中：" + svg.querySelector('[data-key="' + key + '"] .dag-node__title').textContent
          : "点击节点查看关联高亮 · 点击空白处取消";
      }
      svg.addEventListener("click", (event) => highlight(event.target.closest(".dag-node")?.dataset.key || null));
      svg.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          highlight(event.target.closest(".dag-node")?.dataset.key || null);
        }
        if (event.key === "Escape") highlight(null);
      });
      document.getElementById("zoom-in").onclick = () => setZoom(zoom + 0.25);
      document.getElementById("zoom-out").onclick = () => setZoom(zoom - 0.25);
      document.getElementById("fit").onclick = () => setZoom(1);
      setZoom(1);
    </script>
