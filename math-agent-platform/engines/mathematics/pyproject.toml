[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "math-agent-engine"
version = "0.9.0"
description = "Independent mathematical engine with exact, symbolic, numerical and convex operations"
requires-python = ">=3.12"
dependencies = ["sympy==1.14.0", "numpy==2.2.6", "scipy==1.15.3", "pandas==2.2.3", "matplotlib==3.10.3", "cvxpy==1.6.5", "jsonschema==4.23.0"]

[project.scripts]
math-agent-engine = "math_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
math_engine = ["*.json"]
