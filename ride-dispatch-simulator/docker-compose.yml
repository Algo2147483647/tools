services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VECTOR_DATA_DIR: /app/var
      VECTOR_ALLOWED_ORIGINS: http://localhost:4186,http://127.0.0.1:4186
    volumes:
      - simulation-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4186:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  simulation-data:
